<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu dữ liệu văn bằng</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-badge">CCE</span>
        <span>
          <strong>Tra cứu dữ liệu văn bằng</strong>
          <small>Dữ liệu số hóa từ các file Excel</small>
        </span>
      </a>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading-block"><span class="spinner"></span> Đang tải danh sách dữ liệu...</div>
  </main>

  <footer class="footer container" id="footer"></footer>

  <!-- Popup chi tiết bản ghi -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h3 id="modal-title">Chi tiết</h3>
        <button class="btn-close" data-close title="Đóng (Esc)"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="assets/js/app.js"></script>
</body>
</html>
